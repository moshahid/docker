<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unix Username Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 5%,rgba(184,255,61,.09),transparent 28rem),#080c09;color:#f4f7f4;font-family:Arial,sans-serif;padding:32px 20px}.wrap{max-width:980px;margin:auto}.brand{display:flex;align-items:center;gap:12px;margin-bottom:34px}.icon{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:#b8ff3d;color:#101510;font:bold 20px monospace}.eyebrow{margin:0 0 3px;color:#9ba89c;font:11px monospace;letter-spacing:.22em;text-transform:uppercase}.brand h1{font-size:18px;margin:0}.card{display:grid;grid-template-columns:1.08fr .92fr;overflow:hidden;border:1px solid #ffffff1a;border-radius:28px;background:#121914;box-shadow:0 25px 70px #0007}.form,.result{padding:48px}.kicker{color:#b8ff3d;font:11px monospace;letter-spacing:.22em;text-transform:uppercase}.form h2{font-size:44px;line-height:1.05;letter-spacing:-.04em;margin:14px 0 18px}.intro{color:#aab5ab;line-height:1.7;margin:0 0 32px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}input{width:100%;height:48px;border:1px solid #ffffff1a;border-radius:10px;background:#0b100c;color:white;padding:0 14px;font-size:16px;outline:none}input:focus{border-color:#b8ff3d;box-shadow:0 0 0 3px #b8ff3d22}.digits{margin:22px 0}.digit{border:1px solid #ffffff1a;border-radius:8px;background:transparent;color:#aab5ab;padding:10px 16px;font-weight:bold;cursor:pointer}.digit.active{background:#b8ff3d;color:#101510;border-color:#b8ff3d}.generate,.copy{height:48px;border-radius:11px;font-weight:bold;cursor:pointer}.generate{border:0;background:#b8ff3d;color:#101510;padding:0 24px}.result{display:flex;flex-direction:column;justify-content:space-between;background-color:#0a0f0b;background-image:linear-gradient(#b8ff3d12 1px,transparent 1px),linear-gradient(90deg,#b8ff3d12 1px,transparent 1px);background-size:32px 32px;border-left:1px solid #ffffff1a}.lights{display:flex;gap:8px;margin-bottom:54px}.lights i{width:10px;height:10px;border-radius:50%;background:#ff6961}.lights i:nth-child(2){background:#f7cf52}.lights i:nth-child(3){background:#69db7c}.small{color:#748078;font:11px monospace;letter-spacing:.2em;text-transform:uppercase}.username{min-height:70px;color:#b8ff3d;font:bold 36px monospace;overflow-wrap:anywhere;margin-top:18px}.empty{color:#455048;font-size:19px}.copy{width:100%;background:#ffffff0b;border:1px solid #ffffff1a;color:white}.copy:disabled{opacity:.4;cursor:not-allowed}.hint{text-align:center;color:#69756c;font:11px monospace}.toast{min-height:20px;text-align:center;color:#b8ff3d;font-size:13px;margin-top:10px}@media(max-width:760px){.card{grid-template-columns:1fr}.form,.result{padding:30px}.result{border-left:0;border-top:1px solid #ffffff1a;min-height:310px}.fields{grid-template-columns:1fr}.form h2{font-size:34px}}
</style></head><body><main class="wrap"><header class="brand"><span class="icon">$_</span><div><p class="eyebrow">Admin utility</p><h1>Unix Username Generator</h1></div></header><section class="card"><form class="form" id="form"><p class="kicker">Identity builder</p><h2>Create a clean Unix username in seconds.</h2><p class="intro">Enter a person’s name. The generator uses the first initial, last name, and a random numeric suffix—lowercase and Unix-safe.</p><div class="fields"><div><label for="first">First name</label><input id="first" autocomplete="given-name" placeholder="Mohamed" required></div><div><label for="last">Last name</label><input id="last" autocomplete="family-name" placeholder="Shahid" required></div></div><div class="digits"><label>Random digits</label><button class="digit" type="button" data-digits="2">2</button> <button class="digit active" type="button" data-digits="3">3</button> <button class="digit" type="button" data-digits="4">4</button></div><button class="generate" type="submit">↻&nbsp; Generate username</button></form><aside class="result"><div><div class="lights"><i></i><i></i><i></i></div><div class="small">Generated result</div><div class="username empty" id="username" aria-live="polite">waiting_for_input...</div></div><div><button class="copy" id="copy" disabled>▣&nbsp; Copy username</button><div class="toast" id="toast" aria-live="polite"></div><p class="hint">max 32 chars · lowercase ASCII</p></div></aside></section></main>
<script>
let digits=3,current='';const norm=v=>v.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z]/g,'');document.querySelectorAll('.digit').forEach(b=>b.onclick=()=>{digits=+b.dataset.digits;document.querySelectorAll('.digit').forEach(x=>x.classList.toggle('active',x===b))});document.querySelector('#form').onsubmit=e=>{e.preventDefault();const f=norm(document.querySelector('#first').value),l=norm(document.querySelector('#last').value);if(!f||!l)return;let s='';for(let i=0;i<digits;i++)s+=Math.floor(Math.random()*10);current=(f[0]+l).slice(0,32-digits)+s;const out=document.querySelector('#username');out.textContent=current;out.classList.remove('empty');document.querySelector('#copy').disabled=false;document.querySelector('#toast').textContent=''};document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(current);const t=document.querySelector('#toast');t.textContent='Copied to clipboard';setTimeout(()=>t.textContent='',1800)};
</script></body></html>
